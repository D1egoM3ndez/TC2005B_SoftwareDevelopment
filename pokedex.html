<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pokédex</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="pokedex.css">
</head>
<body>
<div class="container">

  <h1>Pokédex</h1>

  <div class="grid">
    <div class="card">
      <img class="card-img" src="https://assets.pokemon.com/assets/cms2/img/pokedex/full/006.png" alt="Pokémon 1">
      <div class="card-body">
        <div class="card-name">Charizard</div>
        <div class="card-number">#006</div>
      </div>
    </div>

    <div class="card">
      <img class="card-img" src="https://assets.pokemon.com/assets/cms2/img/pokedex/full/025.png" alt="Pokémon 2">
      <div class="card-body">
        <div class="card-name">Pikachu</div>
        <div class="card-number">#025</div>
      </div>
    </div>

    <div class="card">
      <img class="card-img" src="https://assets.pokemon.com/assets/cms2/img/pokedex/full/007.png" alt="Pokémon 3">
      <div class="card-body">
        <div class="card-name">Squirtle</div>
        <div class="card-number">#007</div>
      </div>
    </div>

  </div>
</div>
</body>
</html>
